name: Frontend and real financial integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:gateway
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/checkout@v4
        with:
          repository: ediorhodendev/financeiro-carrefour-v2
          ref: bf7f02dd56e4931569273d9b4383ce8a45954081
          path: backend
      - name: Start real PostgreSQL, RabbitMQ and .NET APIs
        run: docker compose up -d --build --wait --wait-timeout 180
        working-directory: backend
      - name: Start frontend Docker image
        run: docker compose up -d --build --wait --wait-timeout 60
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f backend/compose.yaml logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
      - name: Cleanup
        if: always()
        run: |
          docker compose down
          docker compose -f backend/compose.yaml down -v
